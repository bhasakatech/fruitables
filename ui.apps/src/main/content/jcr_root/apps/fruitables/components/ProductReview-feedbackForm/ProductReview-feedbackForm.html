<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"/>
<sly data-sly-call="${clientlib.all @ categories='fruitables.productReviewFeedbackForm'}"/>

<sly data-sly-use.formModel="com.bhasaka.fruitables.core.models.ProductReviewFeedbackFormModel"/>

<div class="product-review-form">
<div class="review-form">
    <h2 class="review-form__title">${formModel.sectionTitle}</h2>

    <form class="review-form__form" novalidate>

        <div class="review-form__row">
            <input
                class="review-form__input"
                type="text"
                name="name"
                placeholder="${formModel.namePlaceholder}"
                required />

            <input
                class="review-form__input"
                type="email"
                name="email"
                placeholder="${formModel.emailPlaceholder}"
                required />
        </div>

        <div class="review-form__rte">
            ${formModel.reviewPlaceholder @ context='html'}
        </div>

        <textarea
            class="review-form__textarea"
            name="review"
            required></textarea>

        <div class="review-form__bottom">

            <div class="review-form__rating-wrap">
                <span class="review-form__rating-label">
                    ${formModel.ratingLabel}
                </span>

                <div class="review-form__rating" data-rating="0">
                    <button type="button" class="review-form__star" data-value="1">&#9733;</button>
                    <button type="button" class="review-form__star" data-value="2">&#9733;</button>
                    <button type="button" class="review-form__star" data-value="3">&#9733;</button>
                    <button type="button" class="review-form__star" data-value="4">&#9733;</button>
                    <button type="button" class="review-form__star" data-value="5">&#9733;</button>
                </div>

                <input
                    type="hidden"
                    name="rating"
                    class="review-form__rating-input"
                    value="0" />
            </div>

            <button type="submit" class="review-form__submit">
                ${formModel.buttonText}
            </button>

        </div>

        <p class="review-form__message" hidden></p>

    </form>
</div>
</div>
