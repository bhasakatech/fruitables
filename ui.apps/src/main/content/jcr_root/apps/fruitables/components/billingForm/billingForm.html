<sly data-sly-use.model="com.bhasaka.fruitables.core.models.BillingFormModel" />

<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html" />
<sly data-sly-call="${clientlib.all @ categories='fruitables.billingForm'}" />

<div class="billing-form">
    <h2>${model.sectionTitle}</h2>
    <form id="billingForm" novalidate>
        <div class="row two-col">
            <div>
                <label for="firstName">${model.firstNameLabel}</label>
                <input type="text" id="firstName" name="firstName" required aria-describedby="firstNameError" />
                <span id="firstNameError" class="error"></span>
            </div>
            <div>
                <label for="lastName">${model.lastNameLabel}</label>
                <input type="text" id="lastName" name="lastName" required aria-describedby="lastNameError" />
                <span id="lastNameError" class="error"></span>
            </div>
        </div>
        <div class="row">
            <label for="companyName">${model.companyNameLabel}</label>
            <input type="text" id="companyName" name="companyName" required aria-describedby="companyNameError" />
            <span id="companyNameError" class="error"></span>
        </div>
        <div class="row">
            <label for="address">${model.addressLabel}</label>
            <input type="text" id="address" name="address" placeholder="${model.addressPlaceholder}" required
                aria-describedby="addressError" />
            <span id="addressError" class="error"></span>
        </div>
        <div class="row">
            <label for="city">${model.cityLabel}</label>
            <input type="text" id="city" name="city" required aria-describedby="cityError" />
            <span id="cityError" class="error"></span>
        </div>
        <div class="row">
            <label for="country">${model.countryLabel}</label>
            <input type="text" id="country" name="country" required aria-describedby="countryError" />
            <span id="countryError" class="error"></span>
        </div>
        <div class="row">
            <label for="zip">${model.zipLabel}</label>
            <input type="text" id="zip" name="zip" required aria-describedby="zipError" />
            <span id="zipError" class="error"></span>
        </div>
        <div class="row">
            <label for="mobile">${model.mobileLabel}</label>
            <input type="tel" id="mobile" name="mobile" required aria-describedby="mobileError" />
            <span id="mobileError" class="error"></span>
        </div>
        <div class="row">
            <label for="email">${model.emailLabel}</label>
            <input type="email" id="email" name="email" required aria-describedby="emailError" />
            <span id="emailError" class="error"></span>
        </div>
        <div class="row checkbox">
            <label class="custom-checkbox">
                <input type="checkbox" />
                <span class="checkmark"></span>
                ${model.createAccountLabel}
            </label>
        </div>
        <div class="row checkbox">
            <label class="custom-checkbox">
                <input type="checkbox" />
                <span class="checkmark"></span>
                ${model.shipDifferentAddressLabel}
            </label>
        </div>
        <div class="row">
            <textarea id="notes" name="notes" placeholder="${model.notesPlaceholder}"></textarea>
        </div>
    </form>
</div>
