<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html" />
<sly data-sly-call="${clientlib.all @ categories='contact.us'}" />

<sly data-sly-use.model="com.bhasaka.fruitables.core.models.ContactUsModel" />

<div class="contact-section">

    <div class="contact-container">

        <div class="contact-header">
            <h1>${model.headingText}</h1>
            <p>${model.descriptionText @ context='html'}</p>
            <a href="#" class="download-link">${model.buttonText}</a>
        </div>

        <div class="map-section">
            <iframe src="${model.mapUrl}" loading="lazy"></iframe>
        </div>

        <div class="contact-content">

            <div class="contact-form">
                <form>
                    <input type="text" placeholder="${model.namePlaceholder}" />
                    <input type="email" placeholder="${model.emailPlaceholder}" />
                    <textarea placeholder="${model.messagePlaceholder}"></textarea>
                    <button type="submit" class="submit-btn">
                        ${model.submitButtonText}
                    </button>
                </form>
            </div>


            <div class="contact-info">

                <div class="info-box">
                    <div class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 
                7-13c0-3.9-3.1-7-7-7zm0 
                9.5c-1.4 0-2.5-1.1-2.5-2.5S10.6 
                6.5 12 6.5s2.5 1.1 2.5 
                2.5S13.4 11.5 12 11.5z" />
                        </svg>
                    </div>
                    <div>
                        <h4>${model.addressLabel}</h4>
                        <p>
                            <a class="details" href="https://www.google.com/maps?q=${model.addressText @ context='uri'}"
                                >
                                ${model.addressText}
                            </a>
                        </p>
                    </div>
                </div>

                <div class="info-box">
                    <div class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 4H4c-1.1 0-2 .9-2 
                2v12c0 1.1.9 2 2 2h16c1.1 0 
                2-.9 2-2V6c0-1.1-.9-2-2-2zm0 
                4-8 5-8-5V6l8 5 8-5v2z" />
                        </svg>
                    </div>
                    <div>
                        <h4>${model.emailLabel}</h4>
                        <a class="details" href="https://mail.google.com/mail/?view=cm&fs=1&to=${model.emailText @ context='uri'}">
                            ${model.emailText}
                        </a>
                    </div>
                </div>

                <div class="info-box">
                    <div class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M6.6 10.8c1.4 2.7 3.9 5.2 
                6.6 6.6l2.2-2.2c.3-.3.7-.4 
                1-.3 1.1.4 2.3.6 3.6.6.6 0 
                1 .4 1 1V20c0 .6-.4 1-1 
                1C10.7 21 3 13.3 3 4c0-.6.4-1 
                1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 
                2.5.6 3.6.1.3 0 .7-.3 
                1l-2.2 2.2z" />
                        </svg>
                    </div>
                    <div>
                        <h4>${model.phoneLabel}</h4>
                        <p>
                            <a class="details" href="tel:${model.phoneNumber}">
                                ${model.phoneNumber}
                            </a>
                        </p>
                    </div>
                </div>

            </div>

        </div>

    </div>
</div>
