<sly data-sly-use.model="com.bhasaka.fruitables.core.models.BottomHeaderModel"/>
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"/>
<sly data-sly-call="${clientlib.all @ categories='fruitables.header'}"/>

<header class="fruitables-main-header">
    <div class="fruitables-container">
        <div class="fruitables-logo">
            <a href="${model.homeLink}.html">
                <img data-sly-test="${model.logoImage}" src="${model.logoImage}" alt="Fruitables"/>
                <span data-sly-test="${!model.logoImage && model.logoText}">
                    ${model.logoText}
                </span>
            </a>
        </div>
        <nav class="fruitables-nav" id="mobileNav">
            <ul data-sly-list.item="${model.menu}">
                <li class="fruitables-nav-item">
                    <div class="fruitables-menu-row">
                        <a href="${item.link  @ extension='html'}">${item.label}</a>
                        <span class="fruitables-toggle"
                              data-sly-test="${item.children && item.children.size > 0}"
                              onclick="toggleSubMenu(this)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </span>
                    </div>             
                    <ul class="fruitables-dropdown"
                        data-sly-test="${item.children && item.children.size > 0}">
                        <li data-sly-list.child="${item.children}">
                            <a href="${child.childLink @ extension='html'}">${child.childLabel}</a>
                        </li>
                    </ul>
                </li>
            </ul>
            <div class="fruitables-mobile-icons">
                <span class="fruitables-search" onclick="openSearch()" data-sly-test="${model.enableSearch}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>           
                <a href="${model.cartPagePath @ extension='html'}" class="fruitables-cart icon-circle">
    <svg class="icon-bag" viewBox="0 0 24 24">
        <path d="M6 7h12l-1 13H7L6 7z" class="bag-body"></path>
        <path d="M9 7V5a3 3 0 0 1 6 0v2" class="bag-handle"></path>
    </svg>
    <span class="badge">${model.defaultCartCount}</span>
</a>
                
            
              <span class="fruitables-user icon-circle">
    <svg class="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
    </svg>
</span>
            </div>
        </nav>

  
        <div class="fruitables-icons">
            <div class="fruitables-icons-group">
                <span class="fruitables-search" onclick="openSearch()" data-sly-test="${model.enableSearch}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                
                
           <a href="${model.cartPagePath @ extension='html'}" class="fruitables-cart icon-circle">
    <svg class="icon-bag" viewBox="0 0 24 24">
        <path d="M6 7h12l-1 13H7L6 7z" class="bag-body"></path>
        <path d="M9 7V5a3 3 0 0 1 6 0v2" class="bag-handle"></path>
    </svg>
    <span class="badge">${model.defaultCartCount}</span>
</a>
                
            
              <span class="fruitables-user icon-circle">
    <svg class="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
    </svg>
</span>
            </div>
            
            <span class="fruitables-hamburger" onclick="toggleMenu()">☰</span>
        </div>
    </div>
</header>


<div id="fruitables-search-overlay" class="fruitables-search-overlay">
    <div class="fruitables-search-box">
        <input type="text" placeholder=" Search by keyword" />
        <button>🔍</button>
    </div>
    <span class="fruitables-search-close" onclick="closeSearch()">✖</span>
</div>
