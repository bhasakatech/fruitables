<sly data-sly-use.model="com.bhasaka.fruitables.core.models.PromoBannerModel"/>


<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"/>
<sly data-sly-call="${clientlib.css @ categories='fruitable.promo'}"/>


<div class="promo-container">

    <div class="promo-row">

        <sly data-sly-list.card="${model.cards}">

            <!--  Added dynamic color class -->
            <div class="promo-card ${card.bgColor}">

                <div class="promo-image">
                    <img src="${card.image}" alt="promo"/>
                </div>

                <!-- Bottom strip -->
                <div class="promo-bottom ${card.bgColor}"></div>

                <!-- Overlay -->
                <div class="promo-overlay ${card.overlayStyle}">
                    <p class="subtitle">${card.subtitle}</p>
                    <h3 class="offer">${card.offer}</h3>
                </div>

            </div>

        </sly>

    </div>

</div>
