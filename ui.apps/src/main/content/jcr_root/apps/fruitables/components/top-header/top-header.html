<sly data-sly-use.topHeader="com.bhasaka.fruitables.core.models.TopHeaderModel"/>
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"/>
<sly data-sly-call="${clientlib.css @ categories='fruitables.header'}"/>
<div class="fruitables-header">
    <div class="fruitables-topbar-parent">
        <div class="fruitables-topbar">
            <div class="fruitables-container">           
                <div class="topbar-left">
                   <a href="https://www.google.com/maps/search/?api=1&query=${topHeader.address @ context='uri'}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5c-1.4 0-2.5-1.1-2.5-2.5S10.6 6.5 12 6.5s2.5 1.1 2.5 2.5S13.4 11.5 12 11.5z"/>
    </svg>
    ${topHeader.address}
    <span class="sr-only">(opens in new tab)</span>
</a>
                    &nbsp;&nbsp;
                    <a href="mailto:${topHeader.email}">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
                        </svg>
                        ${topHeader.email}
                    </a>
                </div>  
                <div class="topbar-right">
                    <sly data-sly-list.link="${topHeader.policyLinks}">
                        <a href="${link.linkUrl @ context='html'}" class="policy-link">
                            ${link.linkText}
                        </a>
                    </sly>
                </div>
            </div>
        </div>
    </div>
</div>
